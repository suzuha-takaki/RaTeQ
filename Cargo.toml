[package]
name = "rateq"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A terminal editor for LaTeX math fragments"

[dependencies]
ratex-layout = "=0.1.16"
ratex-parser = "=0.1.16"
ratex-types = "=0.1.16"
ratex-render = { version = "=0.1.16", features = ["embed-fonts"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-image = { version = "=12.0.0-rc.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-width = "0.2"
ratex-svg = { version = "=0.1.16", features = ["embed-fonts"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
fastrand = "2.5.0"
