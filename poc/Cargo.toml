[package]
name = "rateq-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
ratex-layout = "=0.1.16"
ratex-parser = "=0.1.16"
ratex-types = "=0.1.16"
ratex-render = { version = "=0.1.16", features = ["embed-fonts"] }
ratex-svg = { version = "=0.1.16", features = ["embed-fonts"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "=12.0.0-rc.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
